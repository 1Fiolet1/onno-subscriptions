spring.application.name=onno-subscriptions
spring.config.import=optional:file:.env[.properties]

server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5432}/${POSTGRES_DB:onno_subscriptions}
spring.datasource.username=${POSTGRES_USER:onno}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

onno.scan-packages[0]=ru.seleznev.onnosubscriptions
onno.schema.mode=apply
onno.schema.allow-destructive=false

onno.ui.path=/
onno.ui.locale=ru

onno.auth.mode=in-memory
onno.auth.users[0].username=${ONNO_ADMIN_USERNAME:admin}
onno.auth.users[0].password=${ONNO_ADMIN_PASSWORD}
onno.auth.users[0].roles[0]=ADMIN
onno.auth.session.remember-me.key=${ONNO_REMEMBER_ME_KEY}

org.jobrunr.dashboard.enabled=false
org.jobrunr.background-job-server.enabled=true
subscriptions.time-zone=${APP_TIME_ZONE:Europe/Moscow}
